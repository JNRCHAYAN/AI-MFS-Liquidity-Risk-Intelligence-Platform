# Alembic configuration for upay Shield.
#
# The database URL here is a PLACEHOLDER. `migrations/env.py` overrides it with
# `DATABASE_URL` from `app.core.config.get_settings()` when that variable is
# set. The placeholder exists only so offline SQL generation
# (`alembic upgrade head --sql`) has a PostgreSQL dialect to render against.
# Never put a real credential in this file.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Placeholder only — overridden by DATABASE_URL from the environment.
sqlalchemy.url = postgresql+psycopg://shield:shield@localhost:5432/shield

# Timestamp template for new revision files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
