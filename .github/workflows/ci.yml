name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel superseded runs on the same ref rather than stacking them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Backend: lint, typecheck, unit tests, PostgreSQL integration tests
  # -------------------------------------------------------------------------
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shield
          POSTGRES_PASSWORD: shield
          POSTGRES_DB: shield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shield -d shield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test-only credentials scoped to this ephemeral CI database.
      DATABASE_URL: postgresql+psycopg://shield:shield@localhost:5432/shield_test
      APP_ENV: test
      DEMO_READ_ONLY: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check .

      - name: Format check (ruff)
        working-directory: backend
        run: python -m ruff format --check .

      - name: Type check (mypy)
        working-directory: backend
        # Non-blocking while modules land; tighten once the surface is stable.
        continue-on-error: true
        run: python -m mypy app

      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Unit and integration tests
        working-directory: backend
        run: python -m pytest -q

  # -------------------------------------------------------------------------
  # Frontend: lint, typecheck, production build
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        env:
          # The public homepage must build without a live API.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  # -------------------------------------------------------------------------
  # Container builds — only when delivery files change
  # -------------------------------------------------------------------------
  docker:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t shield-api:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t shield-web:ci ./frontend
